name: Test Build

on:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-18.04

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
    
    - name: Change Gradle Permission
      run: chmod +x ./gradlew
    
    - name: Execute Gradle build
      run: ./gradlew build

    - name: Generate Changelog
      id: changelog
      shell: bash
      env:
        CURRENT: ${{ github.ref }}
      run: |
        current_tag=${CURRENT/refs\/tags\//}
        last_tag=`git describe --tags --abbrev=0 "$current_tag"^ 2>/dev/null || echo`
        if [ last_tag ]; then
        changelog=`git log --pretty="format:%H: %s" ${last_tag}..$current_tag`
        else
        changelog=`git log --pretty="format:%H: %s"`
        fi
        changelog="${changelog//'%'/'%25'}"
        changelog="${changelog//$'\n'/'  %0A'}"
        echo "::set-output name=value::Change set since ${last_tag:-the beginning}:  %0A%0A$changelog"
      
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ${{ steps.changelog.outputs.value }}
        draft: false
        prerelease: true
    
    - name: Upload Release Asset
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} 
        asset_path: ./build/libs/modid-1.0.jar
        asset_name: NebulaeMod-${{ github.ref_name }}.jar
        asset_content_type: application/x-java-archive
