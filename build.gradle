buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
        
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

def modMainSource = file('src/main/java/net/kuina/nebulaecraft/NebulaecraftMod.java')
def versionMatcher = modMainSource.getText('UTF-8') =~ /public\s+static\s+final\s+String\s+VERSION\s*=\s*"([^"]+)"/
if (!versionMatcher.find()) {
    throw new GradleException("Could not find the VERSION constant in ${modMainSource}")
}

version = versionMatcher.group(1)
group = 'com.yourname.modid' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'NebulaeCraft-1.12.2'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8' // Need this here so eclipse task generates correctly.

def isMacosArm = org.gradle.internal.os.OperatingSystem.current().isMacOsX() &&
        ['aarch64', 'arm64'].contains(System.getProperty('os.arch').toLowerCase())

configurations {
    macosArmNatives
}

if (isMacosArm) {
    configurations.all {
        resolutionStrategy.force 'org.lwjgl.lwjgl:lwjgl:2.9.4-nightly-20150209'
        resolutionStrategy.force 'org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209'
        resolutionStrategy.force 'net.java.dev.jna:jna:5.13.0'
    }
}

minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // snapshot_YYYYMMDD   Snapshot are built nightly.
    // stable_#            Stables are built at the discretion of the MCP team.
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    //mappings channel: 'snapshot', version: '20171003-1.12'
    mappings channel: 'snapshot', version: '20171003-1.12'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.
    
    accessTransformer = file('src/main/resources/META-INF/nebulaecraft_at.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }

        server {

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864'
    macosArmNatives fileTree(dir: 'libs/macos-arm64-natives', include: ['*.jar'])

    // You may put jars on which you depend on in ./libs or you may define them like so..
    // compile "some.group:artifact:version:classifier"
    // compile "some.group:artifact:version"

    // Real examples
    // compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    // compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // The 'provided' configuration is for optional dependencies that exist at compile-time but might not at runtime.
    // provided 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // These dependencies get remapped to your current MCP mappings
    // deobf 'com.mod-buildcraft:buildcraft:6.0.8:dev'

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

// ForgeGradle 3's legacy 1.12 joined artifact still contains Side.BUKKIT, which
// crashes NetworkRegistry before a development client can reach the title screen.
// Use the correctly recompiled Forge artifact for runs and apply the two Railcraft
// access wideners to a project-local copy. Production jars use META-INF/FMLAT.
def devForgeRecompiled = new File(gradle.gradleUserHomeDir,
        'caches/forge_gradle/minecraft_user_repo/net/minecraftforge/forge/' +
        '1.12.2-14.23.5.2864_mapped_snapshot_20171003-1.12/' +
        'forge-1.12.2-14.23.5.2864_mapped_snapshot_20171003-1.12-recomp.jar')
def devAccessTransformerTool = new File(gradle.gradleUserHomeDir,
        'caches/forge_gradle/maven_downloader/net/minecraftforge/accesstransformers/' +
        '1.0.5/accesstransformers-1.0.5-fatjar.jar')
def devAccessTransformer = file('gradle/nebulaecraft_dev_at.cfg')
def devForgePatched = file("$buildDir/dev/forge-1.12.2-14.23.5.2864-recomp-nebulaecraft-at.jar")

task prepareDevForgeJar(type: JavaExec) {
    inputs.files devForgeRecompiled, devAccessTransformerTool, devAccessTransformer
    outputs.file devForgePatched
    classpath = files(devAccessTransformerTool)
    main = 'net.minecraftforge.accesstransformer.TransformerProcessor'
    args '--inJar', devForgeRecompiled,
            '--outJar', devForgePatched,
            '--atFile', devAccessTransformer

    doFirst {
        if (!devForgeRecompiled.isFile()) {
            throw new GradleException("Missing recompiled Forge development jar: ${devForgeRecompiled}")
        }
        if (!devAccessTransformerTool.isFile()) {
            throw new GradleException("Missing Forge access transformer tool: ${devAccessTransformerTool}")
        }
        devForgePatched.parentFile.mkdirs()
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('mcmod.info') {
        expand 'version': project.version
    }
}

task copyMacosArmNatives(type: Copy) {
    onlyIf {
        isMacosArm
    }
    from {
        configurations.macosArmNatives.collect { zipTree(it) }
    }
    include 'liblwjgl.dylib', 'openal.dylib', 'libjinput-osx.jnilib'
    into "$buildDir/natives"
}

tasks.matching { it.name == 'extractNatives' }.all {
    finalizedBy copyMacosArmNatives
    copyMacosArmNatives.mustRunAfter it
}

tasks.matching { it.name == 'prepareRunClient' }.all {
    finalizedBy copyMacosArmNatives
}

tasks.withType(JavaExec).all { task ->
    def isLegacyDevClient = task.name == 'net.minecraftforge.legacydev.MainClient.main()' ||
            task.main == 'net.minecraftforge.legacydev.MainClient'
    def isLegacyDevServer = task.name == 'net.minecraftforge.legacydev.MainServer.main()' ||
            task.main == 'net.minecraftforge.legacydev.MainServer'

    if (isLegacyDevClient) {
        dependsOn 'prepareRunClient'
        workingDir project.file('run')
        jvmArgs '-Dforge.logging.console.level=debug',
                '-Dforge.logging.markers=SCAN,REGISTRIES,REGISTRYDUMP'
        environment 'MCP_TO_SRG', project.file('build/createSrgToMcp/output.srg')
        environment 'MOD_CLASSES', project.file('build/sourcesSets/main')
        environment 'mainClass', 'net.minecraft.launchwrapper.Launch'
        environment 'MCP_MAPPINGS', 'snapshot_20171003-1.12'
        environment 'FORGE_VERSION', '14.23.5.2864'
        environment 'assetIndex', '1.12'
        environment 'assetDirectory', new File(gradle.gradleUserHomeDir, 'caches/forge_gradle/assets')
        environment 'nativesDirectory', project.file('build/natives')
        environment 'FORGE_GROUP', 'net.minecraftforge'
        environment 'tweakClass', 'net.minecraftforge.fml.common.launcher.FMLTweaker'
        environment 'MC_VERSION', '1.12.2'
    }

    if (task.name == 'runClient' || task.name == 'runServer' ||
            isLegacyDevClient || isLegacyDevServer) {
        dependsOn prepareDevForgeJar
        doFirst {
            task.classpath = files(task.classpath.files.collect { entry ->
                entry.name == 'forge-1.12.2-14.23.5.2864_mapped_snapshot_20171003-1.12.jar' ?
                        devForgePatched : entry
            })
        }
    }
}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    exclude 'com/mojang/text2speech/**'

    manifest {
        attributes([
            "Specification-Title": "examplemod",
            "Specification-Vendor": "examplemodsareus",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"examplemodsareus",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "FMLAT": "nebulaecraft_at.cfg"
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar') 
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

// FML does not support loading exploded directories as mods.
// Eclipse works fine because it merges classes and resources when debugging
// IntelliJ used to work because FG2 forced the files to be jared during debugging.
// Since FG3+ doesn't do that, we need to merge the sourcesets from gradle's side.
sourceSets.each {
    def dir = layout.buildDirectory.file("sourcesSets/$it.name").get().asFile
    it.output.resourcesDir = dir
    it.java.outputDir = dir
}
